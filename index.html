<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="字·谜" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="字·谜" />
    <link rel="icon" type="image/svg+xml" href="" />
    <link rel="apple-touch-icon" href="" />
    <link rel="manifest" href="" />
    <meta name="description" content="字·谜 — 3D 消除填字游戏" />
    <title>字·谜</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f2eae0;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 120% at 50% 0%, #fbf7f1 0%, #f2eae0 46%, #e8ded1 100%);
        transition: opacity 0.35s ease;
      }
      #boot.boot--hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot__ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 4px solid rgba(174, 193, 212, 0.5);
        border-top-color: #d0a48f;
        animation: bootspin 0.9s linear infinite;
      }
      .boot__name {
        font: 700 20px/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: #554e45;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
      }
      .boot__tip {
        font: 400 13px/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: #8f887c;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" aria-hidden="true">
      <div class="boot__ring"></div>
      <div class="boot__name">字·谜</div>
      <div class="boot__tip">加载中…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
